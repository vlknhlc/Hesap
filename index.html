<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bütçe Takip</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0f172a;color:#f8fafc;font-family:system-ui,sans-serif}
.card{background:#1e293b;border:1px solid #334155}
input,select{background:#334155;color:#fff;border:1px solid #475569}
input:focus,select:focus{outline:none;border-color:#38bdf8}
</style>
</head>
<body class="p-4 md:p-8">

<!-- GİRİŞ EKRANI -->
<div id="login" class="hidden max-w-sm mx-auto mt-24 card rounded-xl p-8 text-center">
  <h1 class="text-2xl font-bold text-sky-400 mb-2">Bütçe Takip</h1>
  <p class="text-sm text-slate-400 mb-6">Verilerin hesabına kaydedilir, her cihazdan ulaşırsın.</p>
  <button onclick="girisYap()" class="bg-sky-600 hover:bg-sky-500 px-4 py-3 rounded-lg font-bold w-full transition">Google ile giriş yap</button>
  <p id="login-hata" class="text-rose-400 text-xs mt-4"></p>
</div>

<!-- UYGULAMA -->
<div id="app" class="hidden max-w-4xl mx-auto">
  <div class="card rounded-xl p-6 mb-6 flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-sky-400">Bütçe Takip</h1>
      <p id="kullanici" class="text-xs text-slate-400"></p>
    </div>
    <div class="flex items-center gap-2 flex-wrap">
      <select id="m-sel" onchange="yukle()" class="p-2 rounded-lg font-semibold">
        <option value="0">Ocak</option><option value="1">Şubat</option><option value="2">Mart</option>
        <option value="3">Nisan</option><option value="4">Mayıs</option><option value="5">Haziran</option>
        <option value="6">Temmuz</option><option value="7">Ağustos</option><option value="8">Eylül</option>
        <option value="9">Ekim</option><option value="10">Kasım</option><option value="11">Aralık</option>
      </select>
      <select id="y-sel" onchange="yukle()" class="p-2 rounded-lg font-semibold"></select>
      <button onclick="oncekiAyiKopyala()" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-sm font-semibold transition">Önceki Ayı Kopyala</button>
      <button onclick="cikisYap()" class="text-slate-400 hover:text-white text-sm px-2">Çıkış</button>
    </div>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
    <div class="card p-4 rounded-xl"><p class="text-xs text-slate-400 font-semibold">Toplam Gelir</p><p id="top-gelir" class="text-xl font-bold text-emerald-400">0 TL</p></div>
    <div class="card p-4 rounded-xl"><p class="text-xs text-slate-400 font-semibold">Toplam Gider</p><p id="top-gider" class="text-xl font-bold text-rose-400">0 TL</p></div>
    <div class="card p-4 rounded-xl"><p class="text-xs text-slate-400 font-semibold">Ödenecek Kalan</p><p id="odenecek-kalan" class="text-xl font-bold text-amber-400">0 TL</p></div>
    <div class="card p-4 rounded-xl"><p class="text-xs text-slate-400 font-semibold">Net Durum</p><p id="net-durum" class="text-xl font-bold">0 TL</p></div>
  </div>

  <div class="card rounded-xl p-6 mb-6">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-bold text-emerald-400">💰 Aylık Gelirler</h2>
      <button onclick="satirEkle('gelir-listesi')" class="bg-emerald-600 hover:bg-emerald-500 text-xs px-3 py-1.5 rounded-lg font-bold transition">+ Gelir Ekle</button>
    </div>
    <div id="gelir-listesi" class="space-y-2"></div>
  </div>

  <div class="card rounded-xl p-6 mb-6">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-bold text-rose-400">💸 Aylık Giderler</h2>
      <button onclick="satirEkle('gider-listesi')" class="bg-rose-600 hover:bg-rose-500 text-xs px-3 py-1.5 rounded-lg font-bold transition">+ Gider Ekle</button>
    </div>
    <div id="gider-listesi" class="space-y-2"></div>
  </div>

  <div class="card rounded-xl p-4 flex flex-wrap items-center justify-between gap-3 border-dashed border-sky-500/50">
    <p class="text-sm text-slate-300">Ek yedek: verilerini dosya olarak da indirebilirsin.</p>
    <div class="flex gap-2">
      <button onclick="yedekIndir()" class="bg-sky-600 hover:bg-sky-500 px-3 py-1.5 rounded-lg text-xs font-bold">📥 Yedekle</button>
      <button onclick="document.getElementById('file-input').click()" class="bg-amber-600 hover:bg-amber-500 px-3 py-1.5 rounded-lg text-xs font-bold">📤 Geri yükle</button>
      <input type="file" id="file-input" onchange="yedekYukle(event)" class="hidden" accept=".json">
    </div>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,doc,getDoc,setDoc,getDocs,collection,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// >>> BURAYA Firebase'den kopyaladığın ayarları yapıştır <<<
const firebaseConfig = {
  apiKey: "BURAYA",
  authDomain: "BURAYA",
  projectId: "BURAYA",
  storageBucket: "BURAYA",
  messagingSenderId: "BURAYA",
  appId: "BURAYA"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, {localCache: persistentLocalCache()});
let uid = null;
const $ = id => document.getElementById(id);
const ref = k => doc(db, 'users', uid, 'months', k);
const donem = () => `${$('y-sel').value}_${$('m-sel').value}`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Yıl listesi: geçen yıl, bu yıl, 3 yıl sonrasına kadar
const buYil = new Date().getFullYear();
for (let y = buYil - 1; y <= buYil + 3; y++) $('y-sel').add(new Option(y, y, false, y === buYil));
$('m-sel').value = new Date().getMonth();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// ---- Giriş / çıkış ----
window.girisYap = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { $('login-hata').textContent = 'Giriş yapılamadı: ' + e.code; }
};
window.cikisYap = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  uid = user ? user.uid : null;
  $('login').classList.toggle('hidden', !!user);
  $('app').classList.toggle('hidden', !user);
  if (user) {
    $('kullanici').textContent = user.email;
    await eskiVeriyiTasi();
    yukle();
  }
});

// ---- Eski localStorage verisini buluta taşı (bir kez) ----
async function eskiVeriyiTasi() {
  const keys = Object.keys(localStorage).filter(k => /^\d{4}_\d{1,2}$/.test(k));
  if (!keys.length || localStorage.getItem('tasindi_' + uid)) return;
  if (!confirm(`Bu cihazda ${keys.length} aylık eski veri bulundu. Hesabına aktarılsın mı?`)) return;
  try {
    const b = writeBatch(db);
    keys.forEach(k => b.set(ref(k), JSON.parse(localStorage.getItem(k))));
    await b.commit();
    localStorage.setItem('tasindi_' + uid, '1');
    alert('✅ Eski verilerin hesabına aktarıldı.');
  } catch (e) { alert('⚠️ Aktarım başarısız: ' + e.message); }
}

// ---- Veri yükle / kaydet ----
const bos = () => ({gelirler: [], giderler: []});
async function ayGetir(k) { const s = await getDoc(ref(k)); return s.exists() ? s.data() : bos(); }

window.yukle = async () => {
  const d = await ayGetir(donem());
  $('gelir-listesi').innerHTML = ''; $('gider-listesi').innerHTML = '';
  d.gelirler.forEach(x => satirEkle('gelir-listesi', x, false));
  d.giderler.forEach(x => satirEkle('gider-listesi', x, false));
  rapor();
};

window.satirEkle = (hedef, o = {}, kaydet = true) => {
  const isGider = hedef === 'gider-listesi';
  const div = document.createElement('div');
  div.className = 'flex flex-wrap items-center gap-2 bg-slate-800 p-2 rounded-lg border border-slate-700';
  div.dataset.tid = o.taksitId || '';
  div.innerHTML = `
    ${isGider ? `<input type="checkbox" class="in-od w-5 h-5 accent-rose-500" ${o.od ? 'checked' : ''}>` : ''}
    <input type="text" class="in-ad flex-1 p-2 rounded text-sm min-w-[150px]" placeholder="Açıklama" value="${esc(o.ad)}">
    <input type="number" inputmode="decimal" class="in-tu w-24 p-2 rounded text-sm text-right" placeholder="Tutar" value="${esc(o.tu)}">
    <input type="number" inputmode="numeric" class="in-gu w-16 p-2 rounded text-sm text-center" placeholder="Gün" value="${esc(o.gu)}">
    ${isGider && !o.taksitId ? `<button class="bt-tk bg-sky-600 hover:bg-sky-500 px-2 py-2 rounded text-xs font-bold">Taksitlendir</button>` : ''}
    ${o.taksitId ? `<span class="bg-slate-700 text-slate-400 text-[10px] px-2 py-1 rounded font-semibold">Taksitli</span>` : ''}
    <button class="bt-sil text-rose-400 hover:text-rose-300 font-bold px-2 text-sm">✕</button>`;
  div.querySelectorAll('input').forEach(i => i.addEventListener('change', kaydet_));
  div.querySelector('.bt-sil').onclick = () => { div.remove(); kaydet_(); };
  const tk = div.querySelector('.bt-tk'); if (tk) tk.onclick = () => taksitlendir(div);
  $(hedef).appendChild(div);
  if (kaydet) div.querySelector('.in-ad').focus();
};

function satirlariOku(listId) {
  return [...$(listId).children].map(r => {
    const o = {ad: r.querySelector('.in-ad').value.trim(), tu: r.querySelector('.in-tu').value.trim(), gu: r.querySelector('.in-gu').value.trim()};
    if (listId === 'gider-listesi') { o.od = r.querySelector('.in-od').checked; o.taksitId = r.dataset.tid || ''; }
    return o;
  }).filter(o => o.ad || o.tu);
}

async function kaydet_() {
  const dk = donem();
  rapor();
  try { await setDoc(ref(dk), {gelirler: satirlariOku('gelir-listesi'), giderler: satirlariOku('gider-listesi')}); }
  catch (e) { alert('⚠️ Kaydedilemedi: ' + e.message); }
}

// ---- Taksit ----
async function taksitlendir(row) {
  const ad = row.querySelector('.in-ad').value.trim(), tu = row.querySelector('.in-tu').value.trim(), gu = row.querySelector('.in-gu').value.trim();
  if (!ad || !tu) return alert('⚠️ Önce açıklama ve tutar gir.');
  const n = parseInt(prompt(`"${ad}" kaç taksit olsun?`));
  if (isNaN(n) || n <= 1) return;
  const gid = 'tks_' + Date.now();
  const sy = +$('y-sel').value, sm = +$('m-sel').value;
  const b = writeBatch(db);
  for (let i = 0; i < n; i++) {
    const t = sm + i, y = sy + Math.floor(t / 12), m = t % 12, dk = `${y}_${m}`;
    const d = i === 0 ? {gelirler: satirlariOku('gelir-listesi'), giderler: satirlariOku('gider-listesi').filter(x => x.ad !== ad)} : await ayGetir(dk);
    d.giderler.push({ad: `${ad} (${i + 1}/${n})`, tu, gu, od: false, taksitId: gid});
    b.set(ref(dk), d);
  }
  try { await b.commit(); alert(`✅ ${n} aya taksit işlendi.`); } catch (e) { alert('⚠️ ' + e.message); }
  yukle();
}

// ---- Rapor ----
function rapor() {
  let g = 0, gi = 0, k = 0;
  [...$('gelir-listesi').children].forEach(r => g += parseFloat(r.querySelector('.in-tu').value) || 0);
  [...$('gider-listesi').children].forEach(r => {
    const t = parseFloat(r.querySelector('.in-tu').value) || 0;
    gi += t; if (!r.querySelector('.in-od').checked) k += t;
  });
  const net = g - gi, f = n => n.toLocaleString('tr-TR') + ' TL';
  $('top-gelir').textContent = f(g); $('top-gider').textContent = f(gi); $('odenecek-kalan').textContent = f(k);
  $('net-durum').textContent = (net >= 0 ? '+' : '') + f(net);
  $('net-durum').className = 'text-xl font-bold ' + (net >= 0 ? 'text-emerald-400' : 'text-rose-400');
}

window.oncekiAyiKopyala = async () => {
  let m = +$('m-sel').value - 1, y = +$('y-sel').value;
  if (m < 0) { m = 11; y--; }
  const s = await getDoc(ref(`${y}_${m}`));
  if (!s.exists()) return alert('⚠️ Önceki aya ait veri yok.');
  if (!confirm('Önceki ayın şablonu bu aya kopyalansın mı? (Bu aydaki mevcut veriler değişir)')) return;
  const o = s.data();
  await setDoc(ref(donem()), {
    gelirler: o.gelirler.map(x => ({ad: x.ad, tu: x.tu, gu: x.gu})),
    giderler: o.giderler.filter(x => !x.taksitId).map(x => ({ad: x.ad, tu: x.tu, gu: x.gu, od: false, taksitId: ''}))
  });
  yukle();
};

// ---- Yedek ----
window.yedekIndir = async () => {
  const snap = await getDocs(collection(db, 'users', uid, 'months')), all = {};
  snap.forEach(d => all[d.id] = d.data());
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(all, null, 2)], {type: 'application/json'}));
  a.download = `butce_yedek_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
};

window.yedekYukle = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const v = JSON.parse(r.result);
      if (!confirm('Yedekteki aylar hesabına yazılacak (aynı aylar üzerine yazılır). Onaylıyor musun?')) return;
      const b = writeBatch(db);
      Object.keys(v).filter(k => /^\d{4}_\d{1,2}$/.test(k)).forEach(k => b.set(ref(k), v[k]));
      await b.commit(); alert('✅ Yedek yüklendi.'); yukle();
    } catch (err) { alert('⚠️ Geçersiz yedek dosyası.'); }
  };
  r.readAsText(f);
};
</script>
</body>
</html>
